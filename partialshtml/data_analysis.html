<script>
    // 刷新数据功能
    function refreshData() {
        const refreshBtn = document.querySelector('.refresh-btn');
        refreshBtn.classList.add('refreshing');
        refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>刷新中...</span>';
        
        setTimeout(() => {
            refreshBtn.classList.remove('refreshing');
            refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i><span>刷新数据</span>';
            console.log('数据已刷新');
        }, 1500);
    }

    (function(){
        // 初始化图表
        async function initCharts() {
            const startTime = Date.now();
            try {
                const isEChartsLoaded = window.EChartsLoader && window.EChartsLoader.isLoaded();
                
                if (!isEChartsLoaded) {
                    showAllLoadingStates();
                    console.log('🔄 ECharts未预加载，正在加载...');
                } else {
                    console.log('⚡ ECharts已预加载，即将快速显示图表');
                }
                
                const chartsConfig = [
                    {
                        id: 'healthMetricsAnalysisChart',
                        option: {
                            grid: { top: 40, right: 20, bottom: 40, left: 50 },
                            tooltip: { 
                                trigger: 'axis',
                                backgroundColor: 'rgba(255, 255, 255, 0.95)',
                                borderColor: '#e8e8ed',
                                borderWidth: 1,
                                textStyle: { color: '#1a1a2e' }
                            },
                            xAxis: { 
                                type: 'category', 
                                data: ['偏瘦', '正常', '偏胖', '肥胖'],
                                axisLine: { lineStyle: { color: '#e8e8ed' } },
                                axisLabel: { color: '#8c8c9a' }
                            },
                            yAxis: { 
                                type: 'value',
                                axisLine: { show: false },
                                splitLine: { lineStyle: { color: '#f0f0f5' } },
                                axisLabel: { color: '#8c8c9a' }
                            },
                            series: [{
                                data: [2, 15, 5, 2],
                                type: 'bar',
                                barWidth: '50%',
                                itemStyle: {
                                    color: function(params) {
                                        const colors = ['#8A9BB0', '#1677FF', '#FAAD14', '#F5222D'];
                                        return colors[params.dataIndex];
                                    },
                                    borderRadius: [4, 4, 0, 0]
                                },
                                emphasis: {
                                    itemStyle: {
                                        shadowBlur: 0
                                    }

        function showAllLoadingStates() {
            const loadingElements = document.querySelectorAll('.chart-loading');
            loadingElements.forEach(el => {
                el.style.display = 'flex';

                const textEl = el.querySelector('p');
                if (textEl) {
                    textEl.textContent = 'ECharts加载中...';
                }
            });
        }
        
        function hideAllLoadingStates() {
            const loadingElements = document.querySelectorAll('.chart-loading');
            loadingElements.forEach(el => {
                el.classList.add('hidden');
                setTimeout(() => {
                    el.style.display = 'none';
                }, 400);
            });
        }
        
        function showErrorState() {
            const loadingElements = document.querySelectorAll('.chart-loading');
            loadingElements.forEach(el => {
                el.style.display = 'flex';
                el.innerHTML = `
                    <div style="color: #C62828; text-align: center;">
                        <p style="font-size: 14px;">图表加载失败，请刷新页面重试</p>
                    </div>
                `;
            });
        }

        function addEventListeners() {
            const userSelect = document.getElementById('userSelect');
            const timeRange = document.getElementById('timeRange');
            
            if (userSelect) {
                userSelect.addEventListener('change', updateCharts);
            }
            if (timeRange) {
                timeRange.addEventListener('change', updateCharts);
            }
        }

        function updateCharts() {
            console.log('更新图表...');
        }
        
        async function init() {
            await initCharts();
            addEventListeners();
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
